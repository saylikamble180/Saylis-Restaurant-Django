<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}

    <h1>Delete Dish</h1>

    <p>Are you sure you want to delete "{{ dish.name }}"?</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'menu' %}">Cancel</a>

    {% endblock %}
</body>
</html>
